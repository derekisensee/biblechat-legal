<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BibleChat - Legal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background-color: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #1d1d1f;
            font-size: 3em;
            margin-bottom: 0.3em;
            font-weight: 700;
        }
        .subtitle {
            color: #86868b;
            font-size: 1.2em;
            margin-bottom: 2em;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
        }
        .link-card {
            background: #f5f5f7;
            border-radius: 12px;
            padding: 30px;
            text-decoration: none;
            color: #1d1d1f;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .link-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border-color: #0071e3;
        }
        .link-card h2 {
            margin: 0 0 10px 0;
            color: #0071e3;
            font-size: 1.5em;
        }
        .link-card p {
            margin: 0;
            color: #86868b;
            font-size: 0.95em;
        }
        .footer {
            margin-top: 40px;
            color: #86868b;
            font-size: 0.85em;
        }
        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
            }
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 BibleChat</h1>
        <p class="subtitle">Legal Documents</p>

        <div class="links">
            <a href="privacy.html" class="link-card">
                <h2>Privacy Policy</h2>
                <p>Learn how we protect and use your personal information</p>
            </a>

            <a href="terms.html" class="link-card">
                <h2>Terms of Service</h2>
                <p>Understand the terms governing your use of BibleChat</p>
            </a>
        </div>

        <div class="footer">
            <p>Last Updated: January 31, 2026</p>
            <p>Questions? Email <a href="mailto:support@dailybibleverseapp.life" style="color: #0071e3;">support@dailybibleverseapp.life</a></p>
        </div>
    </div>
</body>
</html>
